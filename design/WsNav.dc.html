<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Sidebar Workspace</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Navigasi sekolah" style="width: 72px; min-height: 1000px; height: 100%; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #E2E8F0; padding: 14px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: Inter, system-ui, sans-serif; color: #172033">
  <a href="Workspace.dc.html" title="SMP Tunas Harapan" aria-label="SMP Tunas Harapan, ke Dashboard" style="width: 40px; height: 40px; border-radius: 10px; background: {{ accent }}; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; text-decoration: none">TH</a>
  <sc-for list="{{ items }}" as="i" hint-placeholder-count="18">
    <a href="{{ i.href }}" title="{{ i.label }}" aria-label="{{ i.label }}" aria-current="{{ i.current }}" style="{{ i.style }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ i.stroke }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ i.d }}"></path></svg></a>
  </sc-for>
  <span style="margin-top: auto; padding-top: 10px" title="Didukung oleh SEKOLA"><svg width="24" height="24" viewBox="0 0 40 40" role="img" aria-label="Didukung oleh SEKOLA"><rect width="40" height="40" rx="10" fill="#14213D"></rect><path d="M27 11H17.5a4.5 4.5 0 0 0 0 9h5a4.5 4.5 0 0 1 0 9H12" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"></path></svg></span>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"dashboard","options":["dashboard","siswa","guru","akademik","jadwal","absensi","materi","tugas","nilai","keuangan","pengumuman","kalender","ppdb","perpustakaan","ekskul","laporan","pengguna","pengaturan"]},"accent":{"editor":"color","default":"#0E7490"},"$preview":{"width":72,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const accent = this.props.accent ?? '#0E7490';
    const items = [
      ['dashboard', 'Dashboard', 'Workspace.dc.html', 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z'],
      ['siswa', 'Data Siswa', 'Students.dc.html', 'M9 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21c1-4 4-6 7-6s6 2 7 6M16 4a4 4 0 0 1 0 8M22 21c-.6-2.6-2-4.4-4-5.4'],
      ['guru', 'Data Guru & Staf', 'Teachers.dc.html', 'M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5M22 9v6'],
      ['akademik', 'Tahun Ajaran & Kelas', 'Academic.dc.html', 'M3 5h18v16H3zM3 10h18M8 3v4M16 3v4'],
      ['jadwal', 'Jadwal Pelajaran', 'Timetable.dc.html', 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2'],
      ['absensi', 'Absensi', 'Attendance.dc.html', 'M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9'],
      ['materi', 'Materi Pembelajaran', 'Materials.dc.html', 'M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z'],
      ['tugas', 'Tugas & Ujian', 'Assessments.dc.html', 'M5 4h11l3 3v13H5zM9 12h6M9 16h6'],
      ['nilai', 'Nilai & Rapor', 'Grades.dc.html', 'M4 19V9M10 19V5M16 19v-7M22 19H2'],
      ['keuangan', 'Tagihan & Pembayaran', 'Finance.dc.html', 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6'],
      ['pengumuman', 'Pengumuman & Pesan', 'Announcements.dc.html', 'M3 10v4h4l6 5V5L7 10zM17 9a4 4 0 0 1 0 6'],
      ['kalender', 'Kalender Akademik', 'Calendar.dc.html', 'M3 5h18v16H3zM3 10h18M8 3v4M16 3v4M8 15h2M14 15h2'],
      ['ppdb', 'Penerimaan Siswa Baru', 'Admissions.dc.html', 'M15 3H6v18h12V6zM9 14h6M9 18h4M12 8v4M10 10h4'],
      ['perpustakaan', 'Perpustakaan & Fasilitas', 'Library.dc.html', 'M4 4h4v16H4zM10 4h4v16h-4zM16 5l4 1-3 14-4-1z'],
      ['ekskul', 'Ekstrakurikuler', 'Extracurricular.dc.html', 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18'],
      ['laporan', 'Laporan & Analitik', 'Reports.dc.html', 'M21 12a9 9 0 1 1-9-9v9zM15 3a6 6 0 0 1 6 6h-6z'],
      ['pengguna', 'Pengguna & Hak Akses', 'Users.dc.html', 'M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7zM9 12l2 2 4-4'],
      ['pengaturan', 'Pengaturan Sekolah', 'SchoolSettings.dc.html', 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1']
    ];
    return {
      accent,
      items: items.map(([id, label, href, d]) => {
        const on = id === active;
        return { label, href, d, current: on ? 'page' : 'false', stroke: on ? accent : '#64748B',
          style: 'width:44px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:' + (on ? '#F1F5F9' : 'transparent') };
      })
    };
  }
}
</script>
</body>
</html>
